name: Teste do ambiente Horizon IA V1

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de estrutura
        run: python -m unittest discover -s tests -v
      - name: Exemplo fictício
        run: python -m horizon.validator examples/saida_exemplo.json
